[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette deprecation fired by importing fastapi.testclient; not actionable in our code
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:UserWarning",
]
